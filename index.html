<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chat</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .chat-container {
            width: 400px;
            height: 600px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .chat-header {
            background: #4f46e5;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h2 {
            font-size: 20px;
        }

        .chat-header p {
            font-size: 12px;
            margin-top: 5px;
            opacity: 0.8;
        }

        /* Messages */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f9fafb;
        }

        .message {
            margin-bottom: 15px;
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.4;
        }

        .bot-message {
            background: #e5e7eb;
            color: #222;
            border-bottom-left-radius: 3px;
        }

        .user-message {
            background: #4f46e5;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 3px;
        }

        /* Input area */
        .chat-input {
            display: flex;
            padding: 12px;
            background: white;
            border-top: 1px solid #ddd;
        }

        .chat-input input {
            flex: 1;
            padding: 12px;
            border: none;
            outline: none;
            background: #f1f3f5;
            border-radius: 8px;
            font-size: 14px;
        }

        .chat-input button {
            margin-left: 8px;
            padding: 0 18px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .chat-input button:hover {
            background: #4338ca;
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <!-- Header -->
        <div class="chat-header">
            <h2>Simple Chat</h2>
            <p>Online</p>
        </div>

        <!-- Messages -->
        <div class="chat-messages" id="chatMessages">

            <div class="message bot-message">
                Hello! 👋 How can I help you?
            </div>

            <div class="message user-message">
                Hi! I need some help.
            </div>

        </div>

        <!-- Input -->
        <div class="chat-input">
            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
            >

            <button onclick="sendMessage()">
                Send
            </button>
        </div>

    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById("messageInput");
            const message = input.value.trim();

            if (message === "") {
                return;
            }

            // Add user message
            const userMessage = document.createElement("div");
            userMessage.className = "message user-message";
            userMessage.textContent = message;

            const chatMessages = document.getElementById("chatMessages");
            chatMessages.appendChild(userMessage);

            input.value = "";

            // Simple bot response
            setTimeout(() => {
                const botMessage = document.createElement("div");
                botMessage.className = "message bot-message";
                botMessage.textContent = "Thanks for your message! 😊";

                chatMessages.appendChild(botMessage);

                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 500);

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Send message when pressing Enter
        document.getElementById("messageInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>

</body>
</html>
